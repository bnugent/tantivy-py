[project]
name = "tantivy"
version = "0.0.1"
requires-python = ">=3.7"

[project.optional-dependencies]
dev = ["nox"]

[build-system]
requires = ["maturin>=0.13,<0.14"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "maturin",
    "pytest>=4.0",
]

[tool.uv]
package = false

[tool.maturin]
bindings = "pyo3"
